name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Test
        run: pytest -q

      - name: Smoke-test the paper example
        run: python examples/ex_galois_positive.py

      - name: Smoke-test the remaining examples
        run: |
          python examples/ex_euler_cauchy.py
          python examples/ex_particular_solution.py
          python examples/ex_circle.py
          python examples/ex_airy_obstruction.py
          python examples/ex_kovacic_solver.py
          python examples/ex_nomaple.py
